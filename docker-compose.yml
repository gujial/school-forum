version: '3.8'

services:
  # OceanBase 数据库服务
  oceanbase:
    image: oceanbase/oceanbase-ce:4.2.1
    container_name: school-forum-oceanbase
    restart: unless-stopped
    environment:
      # root 用户密码
      - OB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-rootpassword}
      # 初始化租户名
      - OB_TENANT_NAME=${DB_NAME:-school_forum}
      # 是否自动初始化
      - OB_INIT=true
    ports:
      - "2881:2881"   # SQL port
      - "2883:2883"   # RPC port
    volumes:
      - ob_data:/root/data
    networks:
      - school-forum-network
    healthcheck:
      test: ["CMD", "obclient", "-h127.0.0.1", "-uroot@sys", "-P2881", "-prootpassword", "-e", "select 1"]
      timeout: 20s
      retries: 10

  # 应用服务
  app:
    build: .
    container_name: school-forum-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DB_HOST=oceanbase
      - DB_PORT=2881
      - DB_USER=root@${DB_NAME:-school_forum}
      - DB_PASSWORD=${DB_ROOT_PASSWORD:-rootpassword}
      - DB_NAME=${DB_NAME:-school_forum}
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_key}
    ports:
      - "3000:3000"
    volumes:
      - app_data:/app/dynamic
    depends_on:
      oceanbase:
        condition: service_healthy
    networks:
      - school-forum-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/tweets"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  ob_data:
    driver: local
  app_data:
    driver: local

networks:
  school-forum-network:
    driver: bridge
