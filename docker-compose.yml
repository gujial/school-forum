version: '3.8'

services:
  # OceanBase 数据库服务
  oceanbase:
    image: oceanbase/oceanbase-ce:latest
    container_name: school-forum-oceanbase
    restart: unless-stopped
    environment:
      # root 用户密码
      - OB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-rootpassword}
      # 初始化租户名
      - OB_TENANT_NAME=${DB_NAME:-school_forum}
      # 是否自动初始化
      - OB_INIT=true
    ports:
      - "2881:2881"   # SQL port
      - "2883:2883"   # RPC port
    volumes:
      - ob_data:/root/data
    networks:
      - school-forum-network

  # 应用服务
  app:
    image: school_forum:latest
    container_name: school-forum-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DB_HOST=oceanbase
      - DB_PORT=2881
      - DB_USER=root@${DB_NAME:-school_forum}
      - DB_PASSWORD=${DB_ROOT_PASSWORD:-rootpassword}
      - DB_NAME=${DB_NAME:-school_forum}
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_key}
    ports:
      - "3000:3000"
    volumes:
      - app_data:/app/dynamic
    depends_on:
      - oceanbase
    networks:
      - school-forum-network

volumes:
  ob_data:
    driver: local
  app_data:
    driver: local

networks:
  school-forum-network:
    driver: bridge
